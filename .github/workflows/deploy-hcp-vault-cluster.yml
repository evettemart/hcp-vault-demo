name: Deploy HCP Vault Cluster

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Terraform workspace to deploy"
        required: true
        default: non-prod
        type: choice
        options:
          - prod
          - non-prod
      apply:
        description: "Apply Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-hcp-vault-cluster:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform/hcp-vault-aws/vault-cluster
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
      HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Workspace
        run: terraform workspace select "${{ inputs.workspace }}" || terraform workspace new "${{ inputs.workspace }}"

      - name: Terraform Plan
        run: terraform plan -input=false -var-file="${{ inputs.workspace }}.tfvars" -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.apply == true }}
        run: terraform apply -input=false -auto-approve tfplan
